<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload print photos</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 30rem; }
  h1 { font-size: 1.2rem; }
  input, button, textarea { font-size: 1rem; width: 100%; margin: .4rem 0; padding: .5rem; box-sizing: border-box; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; }
  #status { margin-top: .5rem; font-weight: 600; }
</style>
</head>
<body>
<h1>Add photos to print <span id="pid"></span></h1>
<input type="file" id="file" accept="image/*" capture="environment" multiple>
<textarea id="caption" rows="2" placeholder="caption (what/where the failure is)"></textarea>
<button id="send">Upload</button>
<div id="status"></div>
<script>
const printId = location.pathname.split('/')[2];
document.getElementById('pid').textContent = printId;
document.getElementById('send').onclick = async () => {
  const files = document.getElementById('file').files;
  const status = document.getElementById('status');
  if (!files.length) { status.textContent = 'Pick a photo first.'; return; }
  let ok = 0;
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('caption', document.getElementById('caption').value);
    fd.append('source', 'phone');
    const r = await fetch(`/api/prints/${printId}/photos`, { method: 'POST', body: fd });
    if (r.ok) ok++; else status.textContent = 'Error: ' + (await r.text());
  }
  status.textContent = `Uploaded ${ok}/${files.length} photo(s). You can close this page.`;
};
</script>
</body>
</html>
